function openGame(id){
 document.getElementById("home").style.display="none";
 document.getElementById("back").style.display="block";
 ["islem","kelime","hafiza"].forEach(x=>{
   document.getElementById(x).style.display=x==id?"block":"none";
 });
 let frame=document.getElementById(id);
 if(!frame.srcdoc){
   frame.srcdoc=decodeURIComponent(escape(atob(data[id])));
 }
}

function goHome(){
 document.getElementById("home").style.display="block";
 document.getElementById("back").style.display="none";
 ["islem","kelime","hafiza"].forEach(x=>document.getElementById(x).style.display="none");
}
</script>

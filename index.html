<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelime Bul</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#273c75;
    margin:0;
    padding:15px;
}

.game{
    max-width:520px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    position:relative;
    overflow:hidden;
}

h1{
    color:#192a56;
}

h2{
    color:#192a56;
    margin-bottom:4px;
}

button{
    border:0;
    border-radius:15px;
    color:white;
    cursor:pointer;
}

.newgame{
    background:#0984e3;
    width:85%;
    padding:15px;
    font-size:24px;
    box-shadow:0 4px 0 #0a5aa1;
}

.newgame:active{
    box-shadow:0 1px 0 #0a5aa1;
    transform:translateY(3px);
}

.newgame:disabled{
    opacity:.6;
    cursor:default;
}

.info{
    display:flex;
    justify-content:space-around;
    margin:15px;
}

.target{
    font-size:45px;
    font-weight:bold;
    color:#e84118;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
    perspective:700px;
}

.card{
    background:#0097e6;
    color:white;
    padding:18px 5px;
    border-radius:15px;
    font-size:30px;
    font-weight:bold;
    user-select:none;
    cursor:pointer;
    box-shadow:0 4px 0 #006ba3;
}

.card:active{
    box-shadow:0 1px 0 #006ba3;
    transform:translateY(3px);
}

.card.used{
    background:#e84118;
    box-shadow:0 4px 0 #a83217;
    cursor:default;
    opacity:.55;
}

.card.used:active{
    transform:none;
}

.card.joker{
    background:#f9ca24;
    color:#4b3600;
    box-shadow:0 4px 0 #c49a12;
}

.card.joker.used{
    background:#e84118;
    color:white;
    box-shadow:0 4px 0 #a83217;
}

.bottom-buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    margin-top:15px;
}

.undo{
    background:#8e44ad;
    width:110px;
    height:65px;
    font-size:34px;
    font-weight:bold;
    box-shadow:0 4px 0 #6c3483;
}

.undo:active{
    box-shadow:0 1px 0 #6c3483;
    transform:translateY(3px);
}

.equal{
    background:#e67e22;
    width:220px;
    height:65px;
    font-size:24px;
    font-weight:bold;
    box-shadow:0 4px 0 #b3641b;
}

.equal:active{
    box-shadow:0 1px 0 #b3641b;
    transform:translateY(3px);
}

#operation{
    min-height:40px;
    font-size:30px;
    font-weight:bold;
    color:#192a56;
    background:#f1f2f6;
    border:3px solid #0097e6;
    border-radius:12px;
    padding:12px 10px;
    margin:15px 0;
    letter-spacing:2px;
}

#operation .joker-letter{
    color:#c49a12;
}

.loading{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:50px 0;
    gap:15px;
}

.spinner{
    width:55px;
    height:55px;
    border:7px solid #dcdde1;
    border-top:7px solid #0984e3;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
}

.loading p{
    color:#192a56;
    font-size:20px;
    font-weight:bold;
    margin:0;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.dict-status{
    font-size:12px;
    color:#7f8fa6;
    margin-top:6px;
}

/* joker letter picker modal */
.modal-overlay{
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(25,42,86,0.55);
    align-items:center;
    justify-content:center;
    z-index:10;
}

.modal-box{
    background:white;
    border-radius:16px;
    padding:24px;
    width:280px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.modal-box p{
    color:#192a56;
    font-weight:bold;
    font-size:17px;
    margin:0 0 14px;
}

.mini-keyboard{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
}

.mini-key{
    background:#f9ca24;
    color:#4b3600;
    width:100%;
    aspect-ratio:1;
    padding:0;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 3px 0 #c49a12;
    border-radius:9px;
}

.mini-key:active{
    box-shadow:0 1px 0 #c49a12;
    transform:translateY(2px);
}

.shuffle-icon{
    background:#00cec9;
    color:#013330;
    width:65px;
    height:65px;
    font-size:26px;
    box-shadow:0 4px 0 #049992;
}

.shuffle-icon:active{
    box-shadow:0 1px 0 #049992;
    transform:translateY(3px);
}

.card.hop{
    --dx:0px;
    --dy:0px;
    animation:hopMove .45s ease;
    position:relative;
    z-index:5;
}

@keyframes hopMove{
    0%{transform:translate(var(--dx),var(--dy)) scale(1);}
    50%{transform:translate(calc(var(--dx)*0.5),calc(var(--dy)*0.5 - 22px)) scale(1.18);}
    100%{transform:translate(0,0) scale(1);}
}

.score-item{
    position:relative;
}

.floatpoints{
    position:absolute;
    left:50%;
    top:-8px;
    transform:translateX(-50%);
    color:#44bd32;
    font-weight:bold;
    font-size:18px;
    pointer-events:none;
    animation:floatUp 1s ease forwards;
}

@keyframes floatUp{
    0%{opacity:1;transform:translate(-50%,0);}
    100%{opacity:0;transform:translate(-50%,-32px);}
}

@keyframes scoreBump{
    0%{transform:scale(1);}
    50%{transform:scale(1.35);color:#44bd32;}
    100%{transform:scale(1);}
}

.score-bump{
    display:inline-block;
    animation:scoreBump .5s ease;
}

@keyframes cardBounce{
    0%{transform:translateY(0) scale(1);background:#e84118;box-shadow:0 4px 0 #a83217;color:white;}
    2%{transform:translateY(-3px) scale(1.02);background:#1b7a3d;box-shadow:0 4px 0 #124f28;color:white;}
    30%{transform:translateY(-20px) scale(1.1);background:#1b7a3d;box-shadow:0 4px 0 #124f28;color:white;}
    55%{transform:translateY(0) scale(1);background:#1b7a3d;box-shadow:0 4px 0 #124f28;color:white;}
    100%{transform:translateY(0) scale(1);background:#1b7a3d;box-shadow:0 4px 0 #124f28;color:white;}
}

.card.success{
    animation:cardBounce .32s ease forwards;
}

@keyframes cardShake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
}

.card.error{
    animation:cardShake .4s ease;
}

@keyframes opSuccess{
    0%{background:#f1f2f6;}
    35%{background:#44bd32;color:white;}
    100%{background:#f1f2f6;color:#192a56;}
}

#operation.success{
    animation:opSuccess .4s ease;
}

@keyframes opError{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
}

#operation.error{
    animation:opError .4s ease;
}

#message{
    color:#192a56;
    font-weight:bold;
}

.confetti-piece{
    position:absolute;
    bottom:10px;
    font-size:26px;
    pointer-events:none;
    animation:confettiRise 1.3s ease-out forwards;
    z-index:20;
}

@keyframes confettiRise{
    0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1;}
    70%{opacity:1;}
    100%{transform:translateY(-320px) rotate(360deg) scale(1.2);opacity:0;}
}
</style>
</head>

<body>

<div class="game">

<h1>Kelime Bul</h1>

<button class="newgame" id="newGameBtn" onclick="newGame()">Yeni Oyun</button>

<div class="info">
<div>Süre: <span id="time">120</span></div>
<div class="score-item" id="scoreItem">Puan: <span id="score">0</span></div>
</div>

<div class="loading" id="loading">
<div class="spinner"></div>
<p id="loadingText">Oyun hazırlanıyor...</p>
</div>

<div id="gameContent" style="display:none">

<h2>Kalan Kelime</h2>

<div class="target" id="target">--</div>

<div class="cards" id="cards"></div>

<div id="operation">Harf seçiniz</div>

<div class="bottom-buttons">
<button class="undo" onclick="undo()">↶</button>
<button class="equal" onclick="checkWord()">✓ Kontrol Et</button>
<button class="shuffle-icon" onclick="shuffleTiles()" title="Harfleri karıştır">🔀</button>
</div>

<p id="message"></p>

</div>

</div>

<div class="modal-overlay" id="jokerModal">
  <div class="modal-box">
    <p>Joker hangi harf olsun?</p>
    <div class="mini-keyboard" id="miniKeyboard"></div>
  </div>
</div>

let DICTIONARY = new Set(EMBEDDED_WORDS);

function turkishUpper(str){
  return str
    .replace(/i/g,'İ').replace(/ı/g,'I')
    .replace(/ğ/g,'Ğ').replace(/ü/g,'Ü').replace(/ş/g,'Ş').replace(/ö/g,'Ö').replace(/ç/g,'Ç')
    .toUpperCase();
}

/* ---------- Harf torbası (Türkçe harf sıklığına göre) ---------- */

const LETTER_BAG = {
  A:12,B:2,C:2,Ç:2,D:2,E:8,F:1,G:1,Ğ:1,H:1,I:4,İ:7,J:1,K:7,L:7,M:4,
  N:5,O:3,Ö:1,P:1,R:6,S:3,Ş:2,T:5,U:3,Ü:2,V:1,Y:3,Z:2
};
const VOWELS = ['A','E','I','İ','O','Ö','U','Ü'];

function buildBag(){
  let bag=[];
  Object.keys(LETTER_BAG).forEach(l=>{
    for(let i=0;i<LETTER_BAG[l];i++) bag.push(l);
  });
  return bag;
}

function shuffle(arr){
  let a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function canForm(word, baseLetters){
  let pool = baseLetters.slice();
  let jokerAvailable = true;
  let usedJoker = false;
  for(let ch of word){
    let idx = pool.indexOf(ch);
    if(idx !== -1){ pool.splice(idx,1); }
    else if(jokerAvailable){ jokerAvailable = false; usedJoker = true; }
    else return {ok:false};
  }
  if(usedJoker && word.length < 5) return {ok:false};
  return {ok:true, usedJoker:usedJoker};
}

function computeAchievable(baseLetters){
  let result=[];
  DICTIONARY.forEach(w=>{
    if(canForm(w, baseLetters).ok) result.push(w);
  });
  return result;
}

function drawLetters(){
  let bag = buildBag();
  // Yüklü kelime listesindeki tüm kelimeler "A" ile başladığı için
  // A harfinin her turda elde bulunmasını garantiliyoruz.
  let rest = bag.filter(l=>l!=='A');
  let attempt = ['A', ...shuffle(rest).slice(0,6)];
  let vowelCount = attempt.filter(l=>VOWELS.includes(l)).length;
  let tries = 0;
  // En az 2 sesli, en az 3 sessiz harf olacak şekilde (yani sesli sayısı 2-4 arası)
  while((vowelCount < 2 || vowelCount > 4) && tries < 30){
    attempt = ['A', ...shuffle(rest).slice(0,6)];
    vowelCount = attempt.filter(l=>VOWELS.includes(l)).length;
    tries++;
  }
  return shuffle(attempt);
}

/* ---------- Oyun durumu ---------- */

let baseLetters=[];
let achievable=[];
let tiles = [];        // {letter, used}
let sequence = [];      // {index, value, isJoker}
let history = [];
let found = new Set();
let pendingJokerIndex = null;
let timer = null;
let time = 120;
let score = 0;
let over = false;

function scoreFor(word, usedJoker){
  return word.length*10 + (usedJoker?5:0);
}

function newGame(){

  clearInterval(timer);
  over=false;

  history=[];
  sequence=[];
  found=new Set();
  time=120;
  score=0;

  document.getElementById('time').innerHTML=120;
  document.getElementById('score').innerHTML=0;
  document.getElementById('message').innerHTML='';
  document.getElementById('operation').innerHTML='Harf seçiniz';
  document.getElementById('gameContent').style.display='none';
  document.getElementById('loading').style.display='flex';
  document.getElementById('loadingText').innerHTML='Oyun hazırlanıyor...';
  document.getElementById('target').innerHTML='--';
  document.getElementById('cards').innerHTML='';

  setTimeout(()=>{

    // Yeterli sayıda kelime çıkana kadar harfleri yeniden dağıt
    let tries=0;
    do{
      baseLetters = drawLetters();
      achievable = computeAchievable(baseLetters);
      tries++;
    } while(achievable.length < 6 && tries < 25);

    let order=shuffle([...baseLetters,'★']);
    tiles=order.map((l,i)=>({letter:l,used:false,id:i}));

    renderCards();
    updateTarget();

    document.getElementById('loading').style.display='none';
    document.getElementById('gameContent').style.display='block';

    timer=setInterval(()=>{
      time--;
      document.getElementById('time').innerHTML=time;
      if(time<=0){
        clearInterval(timer);
        over=true;
        document.getElementById('message').innerHTML='⏰ Süre bitti';
      }
    },1000);

  },600);

}

function renderCards(){
  let area=document.getElementById('cards');
  area.innerHTML='';
  tiles.forEach((t,i)=>{
    let c=document.createElement('div');
    c.className='card'+(t.letter==='★'?' joker':'')+(t.used?' used':'');
    c.dataset.id=t.id;
    c.innerHTML=t.letter==='★'?'★':t.letter;
    c.onclick=()=>tapTile(i);
    area.appendChild(c);
  });
}

function updateTarget(){
  let remaining=achievable.length-found.size;
  document.getElementById('target').innerHTML=remaining;
}

function saveState(){
  history.push(JSON.stringify({sequence:sequence,tilesUsed:tiles.map(t=>t.used)}));
}

function tapTile(i){
  if(over) return;
  if(tiles[i].used) return;

  if(tiles[i].letter==='★'){
    pendingJokerIndex=i;
    openJokerKeyboard();
    return;
  }

  saveState();
  tiles[i].used=true;
  sequence.push({index:i,value:tiles[i].letter,isJoker:false});
  renderCards();
  updateOperationText();
}

const ALPHABET=['A','B','C','Ç','D','E','F','G','Ğ','H','I','İ','J','K','L','M','N','O','Ö','P','R','S','Ş','T','U','Ü','V','Y','Z'];

function openJokerKeyboard(){
  let kb=document.getElementById('miniKeyboard');
  kb.innerHTML='';
  ALPHABET.forEach(letter=>{
    let b=document.createElement('button');
    b.className='mini-key';
    b.innerHTML=letter;
    b.onclick=()=>pickJokerLetter(letter);
    kb.appendChild(b);
  });
  document.getElementById('jokerModal').style.display='flex';
}

function pickJokerLetter(letter){
  saveState();
  tiles[pendingJokerIndex].used=true;
  sequence.push({index:pendingJokerIndex,value:letter,isJoker:true});
  document.getElementById('jokerModal').style.display='none';
  renderCards();
  updateOperationText();
  pendingJokerIndex=null;
}

function updateOperationText(){
  let box=document.getElementById('operation');
  if(sequence.length===0){
    box.innerHTML='Harf seçiniz';
    return;
  }
  box.innerHTML=sequence.map(s=>{
    return s.isJoker? '<span class="joker-letter">'+s.value+'</span>' : s.value;
  }).join('');
}

function undo(){
  if(history.length===0) return;
  let state=JSON.parse(history.pop());
  sequence=state.sequence;
  tiles.forEach((t,i)=>t.used=state.tilesUsed[i]);
  renderCards();
  updateOperationText();
}

function clearSequence(){
  sequence=[];
  tiles.forEach(t=>t.used=false);
  renderCards();
  updateOperationText();
}

function shuffleTiles(){
  if(over) return;

  // Harfleri karıştırmadan önceki konumlarını kaydet (id'ye göre)
  let oldRects = {};
  document.querySelectorAll('#cards .card').forEach(el=>{
    oldRects[el.dataset.id] = el.getBoundingClientRect();
  });

  sequence=[];
  history=[];
  tiles.forEach(t=>t.used=false);
  tiles = shuffle(tiles);
  renderCards();
  updateOperationText();

  // Yeni konumlarla karşılaştırıp her taşı eski yerinden yeni yerine "zıplatarak" oynat
  document.querySelectorAll('#cards .card').forEach(el=>{
    let oldRect = oldRects[el.dataset.id];
    if(!oldRect) return;
    let newRect = el.getBoundingClientRect();
    let dx = oldRect.left - newRect.left;
    let dy = oldRect.top - newRect.top;
    el.style.setProperty('--dx', dx+'px');
    el.style.setProperty('--dy', dy+'px');
    el.classList.add('hop');
    setTimeout(()=>{
      el.classList.remove('hop');
      el.style.removeProperty('--dx');
      el.style.removeProperty('--dy');
    }, 450);
  });
}

function flashCards(indices, className, duration, stagger){
  stagger = stagger || 0;
  let cardEls = document.querySelectorAll('#cards .card');
  indices.forEach((i,order)=>{
    let el = cardEls[i];
    if(!el) return;
    let delay = order*stagger;
    setTimeout(()=>{
      if(!el) return;
      el.classList.add(className);
    }, delay);
  });
}

function flashOperation(className, duration){
  let opBox = document.getElementById('operation');
  opBox.classList.add(className);
  setTimeout(()=>opBox.classList.remove(className), duration);
}

function bumpScore(){
  let el = document.getElementById('score');
  el.classList.remove('score-bump');
  void el.offsetWidth; // animasyonu yeniden tetiklemek için
  el.classList.add('score-bump');
}

function showFloatingPoints(pts){
  let container = document.getElementById('scoreItem');
  if(!container) return;
  let el = document.createElement('div');
  el.className='floatpoints';
  el.innerHTML='+'+pts;
  container.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

function spawnConfetti(count){
  let container = document.querySelector('.game');
  if(!container) return;
  for(let i=0;i<count;i++){
    let el=document.createElement('div');
    el.className='confetti-piece';
    el.innerHTML='🎉';
    el.style.left=(Math.random()*70+10)+'%';
    el.style.animationDelay=(Math.random()*0.25)+'s';
    container.appendChild(el);
    setTimeout(()=>el.remove(), 1600);
  }
}

function checkWord(){
  if(over) return;
  if(sequence.length===0) return;

  let guess=sequence.map(s=>s.value).join('');
  let usedJoker = sequence.some(s=>s.isJoker);
  let usedIndices = sequence.map(s=>s.index);

  if(usedJoker && guess.length < 5){
    document.getElementById('message').innerHTML='Joker sadece 5 harf ve üzeri kelimelerde kullanılabilir.';
    flashCards(usedIndices, 'error', 400);
    flashOperation('error', 400);
    setTimeout(clearSequence, 400);
    return;
  }

  if(found.has(guess)){
    document.getElementById('message').innerHTML=guess+' zaten bulundu.';
    flashCards(usedIndices, 'error', 400);
    flashOperation('error', 400);
    setTimeout(clearSequence, 400);
    return;
  }

  if(DICTIONARY.has(guess)){
    found.add(guess);
    let pts = scoreFor(guess, usedJoker);
    score += pts;
    document.getElementById('score').innerHTML=score;
    bumpScore();
    showFloatingPoints(pts);
    document.getElementById('message').innerHTML='🎉 '+guess+' buldun! +'+pts+' puan';
    flashCards(usedIndices, 'success', 320, 55);
    flashOperation('success', 400);
    updateTarget();

    if(guess.length >= 6){
      spawnConfetti(10);
    }

    if(achievable.length && found.size >= achievable.length){
      clearInterval(timer);
      over=true;
      score+=100+time;
      document.getElementById('score').innerHTML=score;
      document.getElementById('message').innerHTML='🎉 Tüm kelimeleri buldun! Toplam puan: '+score;
    }
    setTimeout(clearSequence, usedIndices.length*55 + 380);
  } else {
    document.getElementById('message').innerHTML=guess+' geçerli bir kelime değil.';
    flashCards(usedIndices, 'error', 400);
    flashOperation('error', 400);
    setTimeout(clearSequence, 400);
  }

}

// Sözlük yerleşik olarak yüklü, oyun hemen başlayabilir.

</script>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Konfeti</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,"Helvetica Neue",sans-serif;background:#0d3574}
body{color:#172f62}
button{font:inherit;border:0;cursor:pointer}

:root{
  --navy:#0d3574;
  --text:#17366f;
  --green1:#4bc83b;
  --green2:#209c2b;
  --purple1:#9650d4;
  --purple2:#682bb1;
  --orange1:#ffae1b;
  --orange2:#f27d06;
  --blue1:#2b95ec;
  --blue2:#116ed1;
  --red1:#f45d50;
  --red2:#e8342b;
}

/* Ana beyaz kart: görseldeki 35px dış boşluğa yakın */
.app{
  width:98%;
  max-width:895px;
  min-height:calc(100vh - 82px);
  margin:40px auto 50px;
  background:#fff;
  border-radius:52px;
  padding:30px 37px 34px;
  box-shadow:0 20px 45px rgba(0,0,0,.20);
  overflow:visible;
}

/* LOGO */
.header{
  height:135px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo{
  position:relative;
  font-size:78px;
  line-height:1;
  font-weight:800;
  letter-spacing:-4px;
  color:#12366f;
}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti span{
  position:absolute;
  width:14px;height:29px;border-radius:3px;
}
.c1{left:20%;top:18px;background:#ff9715;transform:rotate(-34deg)}
.c2{left:18%;top:65px;background:#8244bd;width:17px!important;height:9px!important;transform:rotate(12deg)}
.c3{left:24%;top:91px;background:#70c824;width:15px!important;height:10px!important;transform:rotate(-32deg)}
.c4{right:21%;top:18px;background:#218de3;transform:rotate(35deg)}
.c5{right:19%;top:67px;background:#85ca18;width:16px!important;height:10px!important;transform:rotate(5deg)}
.c6{right:24%;top:88px;background:#ffb70e;width:14px!important;height:9px!important;transform:rotate(34deg)}

.settings{
  display:none;
  position:absolute;right:0;top:0;
  width:64px;height:64px;border-radius:19px;
  background:#fff;color:#66748b;font-size:37px;
  box-shadow:0 8px 20px rgba(28,45,70,.13);
  display:flex;align-items:center;justify-content:center;
}

/* REKLAM */
.ad{
  height:200px;
  margin:4px 0 34px;
  border-radius:28px;
  position:relative;
  overflow:hidden;
  color:#fff;
  background:linear-gradient(108deg,#ffa800 0%,#f28b0b 26%,#35bd4d 65%,#f1ae0a 100%);
  box-shadow:0 10px 20px rgba(20,35,45,.22);
  display:flex;align-items:center;
  padding:22px 30px;
}
.ad:before{
  content:"";position:absolute;inset:0;
  background:
   radial-gradient(circle at 12% 48%,rgba(255,255,255,.08),transparent 25%),
   radial-gradient(circle at 80% 18%,rgba(255,255,255,.08),transparent 22%);
}
.ad-label{position:absolute;top:27px;left:0;right:0;text-align:center;font-size:21px}
.ad-chart{font-size:72px;width:135px;text-align:center;position:relative;z-index:1}
.ad-copy{position:relative;z-index:1;flex:1;text-align:left;padding-top:18px}
.ad-title{font-size:36px;font-weight:800;white-space:nowrap}
.ad-sub{font-size:24px;margin-top:12px}
.ad-coin{font-size:68px;width:120px;text-align:center;position:relative;z-index:1}
.ad-btn{
  position:relative;z-index:1;
  background:#fff;color:#ef7e12;
  border-radius:40px;padding:17px 35px;
  font-size:25px;font-weight:800;
  white-space:nowrap;
}
.ad-close{
  position:absolute;right:15px;top:14px;z-index:2;
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.28);color:#fff;
  font-size:39px;line-height:1;
}

/* HOŞ GELDİN KARTI */
.welcome{
  min-height:206px;
  margin-bottom:31px;
  border-radius:29px;
  background:#fff;
  box-shadow:0 10px 25px rgba(26,46,75,.13);
  display:flex;align-items:center;
  padding:26px 34px;
}
.avatar{
  width:150px;height:150px;flex:none;
  border-radius:50%;
  background:linear-gradient(145deg,#e9edf3,#d8e1eb);
  display:flex;align-items:center;justify-content:center;
  font-size:88px;position:relative;
}
.online{
  position:absolute;right:6px;bottom:8px;
  width:32px;height:32px;border-radius:50%;
  background:#42bb3e;border:5px solid #fff;
}
.welcome-content{flex:1;padding-left:42px}
.greeting{font-size:37px;font-weight:800;margin-bottom:25px}
.stats{display:flex;align-items:center}
.stat{display:flex;align-items:center;gap:15px;flex:1}
.stat-icon{font-size:49px}
.stat b{display:block;font-size:31px}
.stat small{display:block;color:#53627d;font-size:20px;margin-top:4px}
.vline{height:62px;width:2px;background:#e5e8ee;margin:0 28px}

/* BUTONLAR */
.menu-card{
  width:100%;
  min-height:128px;
  border-radius:29px;
  color:#fff;
  margin-bottom:25px;
  display:flex;align-items:center;
  padding:18px 35px;
  text-align:left;
  box-shadow:0 7px 0 rgba(0,0,0,.22),0 9px 18px rgba(25,40,60,.10);
  transition:transform .1s,filter .1s;
  position:relative;overflow:hidden;
}
.menu-card:active{transform:translateY(4px);filter:brightness(.96)}
.new{min-height:169px;background:linear-gradient(105deg,var(--green1),var(--green2))}
.purple{background:linear-gradient(105deg,var(--purple1),var(--purple2))}
.orange{background:linear-gradient(105deg,var(--orange1),var(--orange2))}
.blue{background:linear-gradient(105deg,var(--blue1),var(--blue2))}
.red{background:linear-gradient(105deg,var(--red1),var(--red2))}

.icon-circle{
  width:92px;height:92px;border-radius:50%;
  flex:none;margin-right:35px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(85,20,150,.24);
  font-size:49px;
}
.new .icon-circle{
  width:102px;height:102px;
  background:#fff;color:#209e32;
  font-size:52px;
  box-shadow:0 5px 11px rgba(0,0,0,.12);
}
.menu-copy{flex:1}
.menu-copy b{display:block;font-size:37px;font-weight:800}
.menu-copy span{display:block;font-size:22px;margin-top:7px}
.arrow{font-size:48px;font-weight:300;margin-left:20px}
.badge{
  min-width:60px;height:60px;padding:0 15px;
  border-radius:50%;
  background:#ed4937;
  display:flex;align-items:center;justify-content:center;
  font-size:29px;font-weight:800;
  box-shadow:0 3px 7px rgba(0,0,0,.17);
}

.section-title{
  display:flex;align-items:center;gap:17px;
  color:#9ca6b7;font-size:20px;font-weight:700;
  margin:7px 0 22px;
}
.section-title:before,.section-title:after{content:"";height:2px;background:#e8ebef;flex:1}

/* =========================================================
   TÜM TELEFON / TABLET UYUMLULUĞU
   - iPhone SE'den büyük telefonlara
   - Android küçük/büyük ekranlara
   - yatay kullanım
   - çentik / safe-area
   - dinamik ekran yüksekliği
   ========================================================= */

html{
  width:100%;
  min-width:0;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

body{
  width:100%;
  min-width:0;
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
  padding:
    max(0px, env(safe-area-inset-top))
    max(0px, env(safe-area-inset-right))
    max(0px, env(safe-area-inset-bottom))
    max(0px, env(safe-area-inset-left));
}

.app{
  width:97%;
  max-width:895px;
  min-height:auto;
  margin:
    clamp(5px, 1.2vh, 16px) auto
    max(12px, env(safe-area-inset-bottom));
  padding:clamp(16px, 3.5vw, 30px)
          clamp(12px, 4.1vw, 37px)
          clamp(18px, 4vw, 34px);
  border-radius:clamp(24px, 5vw, 52px);
}

/* Logo alanı */
.header{
  height:clamp(72px, 14vw, 135px);
  min-height:72px;
}
.logo{
  font-size:clamp(42px, 8.7vw, 78px);
  letter-spacing:clamp(-3px, -.45vw, -4px);
}
.settings{
  width:clamp(46px, 7.2vw, 64px);
  height:clamp(46px, 7.2vw, 64px);
  border-radius:clamp(14px, 2.1vw, 19px);
  font-size:clamp(27px, 4vw, 37px);
}

/* Reklam */
.ad{
  height:100px;
  margin:clamp(3px, 1vw, 4px) 0 clamp(20px, 3.5vw, 34px);
  border-radius:clamp(19px, 3.1vw, 28px);
  padding:clamp(12px, 2.5vw, 22px)
          clamp(12px, 3.4vw, 30px);
  gap:clamp(7px, 1.5vw, 18px);
}
.ad-label{
  top:clamp(13px, 3vw, 27px);
  font-size:clamp(12px, 2.3vw, 21px);
}
.ad-chart{
  font-size:clamp(36px, 7.5vw, 72px);
  width:clamp(55px, 14vw, 135px);
}
.ad-copy{
  padding-top:clamp(9px, 2vw, 18px);
  min-width:0;
}
.ad-title{
  font-size:clamp(17px, 3.8vw, 36px);
  overflow:hidden;
  text-overflow:ellipsis;
}
.ad-sub{
  font-size:clamp(11px, 2.5vw, 24px);
  margin-top:clamp(4px, 1.2vw, 12px);
  white-space:nowrap;
}
.ad-coin{
  font-size:clamp(29px, 7vw, 68px);
  width:clamp(45px, 12vw, 120px);
}
.ad-btn{
  font-size:clamp(12px, 2.6vw, 25px);
  padding:clamp(9px, 1.9vw, 17px)
          clamp(10px, 3.9vw, 35px);
}
.ad-close{
  width:clamp(34px, 5.5vw, 50px);
  height:clamp(34px, 5.5vw, 50px);
  font-size:clamp(26px, 4.3vw, 39px);
  right:clamp(7px, 1.5vw, 15px);
  top:clamp(7px, 1.5vw, 14px);
}

/* Hoş geldin */
.welcome{
  min-height:clamp(114px, 20vw, 190px);
  margin-bottom:clamp(18px, 3.2vw, 31px);
  border-radius:clamp(19px, 3.2vw, 29px);
  padding:clamp(12px, 2.7vw, 22px)
          clamp(12px, 3.5vw, 30px);
}
.avatar{
  width:clamp(72px, 13.5vw, 138px);
  height:clamp(72px, 13.5vw, 138px);
  font-size:clamp(42px, 7.8vw, 80px);
}
.online{
  width:clamp(19px, 3.4vw, 32px);
  height:clamp(19px, 3.4vw, 32px);
  border-width:clamp(3px, .55vw, 5px);
  right:clamp(1px, .6vw, 6px);
  bottom:clamp(2px, .8vw, 8px);
}
.welcome-content{
  padding-left:clamp(12px, 4.5vw, 42px);
  min-width:0;
}
.greeting{
  font-size:clamp(18px, 3.8vw, 34px);
  margin-bottom:clamp(10px, 2.8vw, 25px);
  white-space:nowrap;
}
.stats{min-width:0}
.stat{
  gap:clamp(5px, 1.6vw, 15px);
  min-width:0;
}
.stat-icon{
  font-size:clamp(25px, 5.4vw, 49px);
  flex:none;
}
.stat b{
  font-size:clamp(18px, 3.5vw, 31px);
}
.stat small{
  font-size:clamp(10px, 2.2vw, 20px);
  white-space:nowrap;
}
.vline{
  height:clamp(40px, 7vw, 62px);
  margin:0 clamp(7px, 3vw, 28px);
}

/* Menü kartları */
.menu-card{
  min-height:clamp(60px, 8.7vw, 88px);
  border-radius:clamp(19px, 3.2vw, 29px);
  margin-bottom:clamp(8px, 1.3vw, 13px);
  padding:clamp(9px, 1.8vw, 16px)
          clamp(13px, 3.8vw, 35px);
  box-shadow:0 6px 0 rgba(0,0,0,.22),0 8px 16px rgba(25,40,60,.10);
}
.new{min-height:clamp(72px, 10.8vw, 114px)}
.icon-circle{
  width:clamp(56px, 9.8vw, 92px);
  height:clamp(56px, 9.8vw, 92px);
  margin-right:clamp(13px, 3.8vw, 35px);
  font-size:clamp(29px, 5.2vw, 49px);
}
.new .icon-circle{
  width:clamp(65px, 10.8vw, 102px);
  height:clamp(65px, 10.8vw, 102px);
  font-size:clamp(33px, 5.7vw, 52px);
}
.menu-copy{min-width:0}
.menu-copy b{
  font-size:clamp(22px, 4.1vw, 37px);
  line-height:1.08;
}
.menu-copy span{
  font-size:clamp(12px, 2.45vw, 22px);
  margin-top:clamp(3px, .8vw, 7px);
  line-height:1.2;
}
.arrow{
  font-size:clamp(31px, 5.3vw, 48px);
  margin-left:clamp(7px, 2vw, 20px);
  flex:none;
}
.badge{
  min-width:clamp(40px, 6.7vw, 60px);
  height:clamp(40px, 6.7vw, 60px);
  font-size:clamp(18px, 3.1vw, 29px);
  padding:0 clamp(9px, 1.7vw, 15px);
  flex:none;
}
.section-title{
  font-size:clamp(13px, 2.4vw, 20px);
  gap:clamp(8px, 1.8vw, 17px);
  margin:clamp(2px, .8vw, 7px) 0 clamp(12px, 2.4vw, 22px);
}

/* Çok dar telefonlar: iPhone SE / küçük Android */
@media(max-width:390px){
  .app{
    width:calc(100% - 6px);
    margin-top:9px;
    border-radius:24px;
    padding-left:10px;
    padding-right:10px;
  }
  .header{min-height:67px;height:72px}
  .logo{font-size:39px}
  .settings{width:43px;height:43px;font-size:25px}
  .ad{height:100px}
  .ad-chart,.ad-coin{display:none}
  .ad-copy{padding-left:5px}
  .ad-title{font-size:17px}
  .ad-sub{font-size:11px}
  .ad-btn{font-size:11px;padding:8px 9px}
  .welcome{padding:12px 10px}
  .avatar{width:70px;height:70px;font-size:42px}
  .welcome-content{padding-left:9px}
  .greeting{font-size:18px}
  .stat-icon{font-size:23px}
  .stat b{font-size:17px}
  .stat small{font-size:9px}
  .vline{margin:0 5px}
  .menu-card{padding-left:10px;padding-right:10px}
  .icon-circle{margin-right:11px}
  .menu-copy b{font-size:20px}
  .menu-copy span{font-size:11px}
  .arrow{font-size:29px}
}

/* Yatay telefon */
@media (orientation:landscape) and (max-height:600px){
  .app{
    width:min(760px,calc(100% - 28px));
    margin:12px auto;
    padding:14px 18px 18px;
  }
  .header{height:72px}
  .ad{height:100px;margin-bottom:16px}
  .welcome{min-height:100px;margin-bottom:16px}
  .avatar{width:72px;height:72px}
  .menu-card{min-height:66px;margin-bottom:9px}
  .new{min-height:78px}
  .icon-circle{width:50px;height:50px}
  .new .icon-circle{width:58px;height:58px}
  .menu-copy b{font-size:21px}
  .menu-copy span{font-size:11px}
}

/* Tablet / geniş telefon: tasarım gereksiz büyümesin */
@media(min-width:701px) and (max-width:950px){
  .app{width:calc(100% - 40px)}
}

/* Dokunmatik cihazlarda butonlar rahat tıklansın */
@media (pointer:coarse){
  button{touch-action:manipulation}
}

/* Ekrana tam sığdırma */
.app{
  transform-origin:center top;
  will-change:transform;
}
.play-icon{
  width:0!important;
  height:0!important;
  border-top:22px solid transparent;
  border-bottom:22px solid transparent;
  border-left:31px solid #209e32;
  border-radius:3px;
  background:transparent!important;
  box-shadow:none!important;
  margin-left:6px!important;
}
@media(max-width:700px){
  .play-icon{
    width:67px!important;
    height:67px!important;
  }
  .play-icon::after{
    border-top-width:13px;
    border-bottom-width:13px;
    border-left-width:20px;
  }
}


/* Profil ikonu: mavi butonda beyaz, net ve emoji-font bağımsız */
.profile-icon{
  position:relative;
  background:rgba(0,73,155,.42)!important;
}
.profile-icon .profile-head{
  position:absolute;
  width:25px;height:25px;
  border-radius:50%;
  background:#fff;
  left:50%;top:18px;
  transform:translateX(-50%);
}
.profile-icon .profile-body{
  position:absolute;
  width:48px;height:25px;
  border-radius:28px 28px 18px 18px;
  background:#fff;
  left:50%;bottom:16px;
  transform:translateX(-50%);
}
@media(max-width:700px){
  .profile-icon .profile-head{
    width:16px;height:16px;top:11px;
  }
  .profile-icon .profile-body{
    width:32px;height:17px;bottom:10px;
  }
}

  min-height:118px!important;

  display:flex!important;
  align-items:center!important;
}

  }

  display:grid !important;

}

<style id="scroll-only-fix">
/* Yalnızca dikey kaydırma düzeltmesi */
html{

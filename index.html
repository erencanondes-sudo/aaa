<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Konfeti</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,"Helvetica Neue",sans-serif;background:#0d3574}
body{color:#172f62}
button{font:inherit;border:0;cursor:pointer}

:root{
  --navy:#0d3574;
  --text:#17366f;
  --green1:#4bc83b;
  --green2:#209c2b;
  --purple1:#9650d4;
  --purple2:#682bb1;
  --orange1:#ffae1b;
  --orange2:#f27d06;
  --blue1:#2b95ec;
  --blue2:#116ed1;
  --red1:#f45d50;
  --red2:#e8342b;
}

/* Ana beyaz kart: görseldeki 35px dış boşluğa yakın */
.app{
  width:calc(100% - 70px);
  max-width:895px;
  min-height:calc(100vh - 82px);
  margin:40px auto 50px;
  background:#fff;
  border-radius:52px;
  padding:30px 37px 34px;
  box-shadow:0 20px 45px rgba(0,0,0,.20);
  overflow:hidden;
}

/* LOGO */
.header{
  height:135px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo{
  position:relative;
  font-size:78px;
  line-height:1;
  font-weight:800;
  letter-spacing:-4px;
  color:#12366f;
}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti span{
  position:absolute;
  width:14px;height:29px;border-radius:3px;
}
.c1{left:20%;top:18px;background:#ff9715;transform:rotate(-34deg)}
.c2{left:18%;top:65px;background:#8244bd;width:17px!important;height:9px!important;transform:rotate(12deg)}
.c3{left:24%;top:91px;background:#70c824;width:15px!important;height:10px!important;transform:rotate(-32deg)}
.c4{right:21%;top:18px;background:#218de3;transform:rotate(35deg)}
.c5{right:19%;top:67px;background:#85ca18;width:16px!important;height:10px!important;transform:rotate(5deg)}
.c6{right:24%;top:88px;background:#ffb70e;width:14px!important;height:9px!important;transform:rotate(34deg)}

.settings{
  display:none;
  position:absolute;right:0;top:0;
  width:64px;height:64px;border-radius:19px;
  background:#fff;color:#66748b;font-size:37px;
  box-shadow:0 8px 20px rgba(28,45,70,.13);
  display:flex;align-items:center;justify-content:center;
}

/* REKLAM */
.ad{
  height:200px;
  margin:4px 0 34px;
  border-radius:28px;
  position:relative;
  overflow:hidden;
  color:#fff;
  background:linear-gradient(108deg,#ffa800 0%,#f28b0b 26%,#35bd4d 65%,#f1ae0a 100%);
  box-shadow:0 10px 20px rgba(20,35,45,.22);
  display:flex;align-items:center;
  padding:22px 30px;
}
.ad:before{
  content:"";position:absolute;inset:0;
  background:
   radial-gradient(circle at 12% 48%,rgba(255,255,255,.08),transparent 25%),
   radial-gradient(circle at 80% 18%,rgba(255,255,255,.08),transparent 22%);
}
.ad-label{position:absolute;top:27px;left:0;right:0;text-align:center;font-size:21px}
.ad-chart{font-size:72px;width:135px;text-align:center;position:relative;z-index:1}
.ad-copy{position:relative;z-index:1;flex:1;text-align:left;padding-top:18px}
.ad-title{font-size:36px;font-weight:800;white-space:nowrap}
.ad-sub{font-size:24px;margin-top:12px}
.ad-coin{font-size:68px;width:120px;text-align:center;position:relative;z-index:1}
.ad-btn{
  position:relative;z-index:1;
  background:#fff;color:#ef7e12;
  border-radius:40px;padding:17px 35px;
  font-size:25px;font-weight:800;
  white-space:nowrap;
}
.ad-close{
  position:absolute;right:15px;top:14px;z-index:2;
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.28);color:#fff;
  font-size:39px;line-height:1;
}

/* HOŞ GELDİN KARTI */
.welcome{
  min-height:206px;
  margin-bottom:31px;
  border-radius:29px;
  background:#fff;
  box-shadow:0 10px 25px rgba(26,46,75,.13);
  display:flex;align-items:center;
  padding:26px 34px;
}
.avatar{
  width:150px;height:150px;flex:none;
  border-radius:50%;
  background:linear-gradient(145deg,#e9edf3,#d8e1eb);
  display:flex;align-items:center;justify-content:center;
  font-size:88px;position:relative;
}
.online{
  position:absolute;right:6px;bottom:8px;
  width:32px;height:32px;border-radius:50%;
  background:#42bb3e;border:5px solid #fff;
}
.welcome-content{flex:1;padding-left:42px}
.greeting{font-size:37px;font-weight:800;margin-bottom:25px}
.stats{display:flex;align-items:center}
.stat{display:flex;align-items:center;gap:15px;flex:1}
.stat-icon{font-size:49px}
.stat b{display:block;font-size:31px}
.stat small{display:block;color:#53627d;font-size:20px;margin-top:4px}
.vline{height:62px;width:2px;background:#e5e8ee;margin:0 28px}

/* BUTONLAR */
.menu-card{
  width:100%;
  min-height:128px;
  border-radius:29px;
  color:#fff;
  margin-bottom:25px;
  display:flex;align-items:center;
  padding:18px 35px;
  text-align:left;
  box-shadow:0 7px 0 rgba(0,0,0,.22),0 9px 18px rgba(25,40,60,.10);
  transition:transform .1s,filter .1s;
  position:relative;overflow:hidden;
}
.menu-card:active{transform:translateY(4px);filter:brightness(.96)}
.new{min-height:169px;background:linear-gradient(105deg,var(--green1),var(--green2))}
.purple{background:linear-gradient(105deg,var(--purple1),var(--purple2))}
.orange{background:linear-gradient(105deg,var(--orange1),var(--orange2))}
.blue{background:linear-gradient(105deg,var(--blue1),var(--blue2))}
.red{background:linear-gradient(105deg,var(--red1),var(--red2))}

.icon-circle{
  width:92px;height:92px;border-radius:50%;
  flex:none;margin-right:35px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(85,20,150,.24);
  font-size:49px;
}
.new .icon-circle{
  width:102px;height:102px;
  background:#fff;color:#209e32;
  font-size:52px;
  box-shadow:0 5px 11px rgba(0,0,0,.12);
}
.menu-copy{flex:1}
.menu-copy b{display:block;font-size:37px;font-weight:800}
.menu-copy span{display:block;font-size:22px;margin-top:7px}
.arrow{font-size:48px;font-weight:300;margin-left:20px}
.badge{
  min-width:60px;height:60px;padding:0 15px;
  border-radius:50%;
  background:#ed4937;
  display:flex;align-items:center;justify-content:center;
  font-size:29px;font-weight:800;
  box-shadow:0 3px 7px rgba(0,0,0,.17);
}

.section-title{
  display:flex;align-items:center;gap:17px;
  color:#9ca6b7;font-size:20px;font-weight:700;
  margin:7px 0 22px;
}
.section-title:before,.section-title:after{content:"";height:2px;background:#e8ebef;flex:1}


/* FINAL RESPONSIVE DÜZEN */
html,body{
  width:100%;
  min-width:0;
  height:100%;
  min-height:100%;
  overflow:hidden;
}
body{
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:
    max(4px,env(safe-area-inset-top))
    max(4px,env(safe-area-inset-right))
    max(4px,env(safe-area-inset-bottom))
    max(4px,env(safe-area-inset-left));
}
.app{
  width:calc(100vw - 10px);
  max-width:1040px;
  height:calc(100dvh - 8px);
  min-height:0;
  margin:4px auto 0;
  padding:clamp(10px,2.2vw,24px)
          clamp(10px,3vw,30px)
          clamp(10px,2.2vw,24px);
  border-radius:clamp(22px,4vw,46px);
  overflow:hidden;
}

/* Dikey yerleşimi ekran yüksekliğine göre akışkan tut */
.header{
  height:clamp(60px,11.5vh,112px);
  min-height:60px;
}
.logo{
  font-size:clamp(40px,8vw,70px);
}
.ad{
  width:min(320px,100%);
  height:100px;
  flex:none;
  margin:4px auto clamp(10px,2.2vh,22px);
  padding:10px 12px;
}
.ad-label{top:9px;font-size:12px}
.ad-chart{font-size:34px;width:45px}
.ad-title{font-size:17px}
.ad-sub{font-size:10px;margin-top:3px}
.ad-coin{font-size:32px;width:40px}
.ad-btn{font-size:11px;padding:7px 10px}
.ad-close{width:31px;height:31px;font-size:24px;right:6px;top:6px}

/* Profil kartı */
.welcome{
  min-height:0;
  height:clamp(108px,16vh,160px);
  margin-bottom:clamp(9px,1.8vh,17px);
  padding:clamp(10px,2vw,18px) clamp(12px,3vw,26px);
}
.avatar{
  width:clamp(64px,11vw,112px);
  height:clamp(64px,11vw,112px);
  font-size:clamp(38px,6.8vw,68px);
}
.online{width:22px;height:22px;border-width:3px;right:2px;bottom:3px}
.welcome-content{padding-left:clamp(10px,3.5vw,30px)}
.greeting{font-size:clamp(18px,3.4vw,30px);margin-bottom:clamp(8px,1.8vh,16px)}
.stat{gap:8px}
.stat-icon{font-size:clamp(23px,4.5vw,40px)}
.stat b{font-size:clamp(17px,3vw,27px)}
.stat small{font-size:clamp(9px,1.8vw,16px)}
.vline{height:44px;margin:0 clamp(6px,2vw,18px)}

/* Menü: yüksekliği kontrollü */
.menu-card{
  min-height:clamp(60px,9.2vh,88px);
  margin-bottom:clamp(7px,1.15vh,12px);
  padding:8px clamp(10px,3vw,26px);
  border-radius:clamp(18px,2.8vw,26px);
}
.new{
  min-height:clamp(72px,11vh,106px);
}
.icon-circle{
  width:clamp(50px,8.2vw,78px);
  height:clamp(50px,8.2vw,78px);
  margin-right:clamp(10px,2.7vw,25px);
  font-size:clamp(26px,4.6vw,42px);
}
.new .icon-circle{
  width:clamp(58px,9vw,84px);
  height:clamp(58px,9vw,84px);
  font-size:clamp(30px,5vw,44px);
}
.menu-copy b{font-size:clamp(20px,3.6vw,32px)}
.menu-copy span{font-size:clamp(11px,2vw,17px);margin-top:3px}
.arrow{font-size:clamp(29px,4.5vw,42px);margin-left:8px}
.badge{
  min-width:clamp(38px,5.8vw,52px);
  height:clamp(38px,5.8vw,52px);
  font-size:clamp(17px,2.8vw,25px);
}
.section-title{
  font-size:clamp(12px,1.9vw,17px);
  margin:2px 0 clamp(9px,1.5vh,14px);
}

/* Yeni Oyun: beyaz daireyi garanti altına al */
.new-game-card{
  min-height:clamp(72px,11vh,106px)!important;
  padding:8px clamp(10px,3vw,26px)!important;
}
.new-play-circle{
  width:clamp(58px,8.5vw,82px)!important;
  height:clamp(58px,8.5vw,82px)!important;
  min-width:clamp(58px,8.5vw,82px)!important;
  margin-right:clamp(12px,2.7vw,25px);
  border-radius:50%;
  background:#fff!important;
}
.new-play-triangle{
  border-top:clamp(9px,1.5vw,13px) solid transparent;
  border-bottom:clamp(9px,1.5vw,13px) solid transparent;
  border-left:clamp(14px,2.2vw,20px) solid #209e32;
}

/* Kısa ekranlar: dikeyde daha kompakt */
@media(max-height:760px) and (orientation:portrait){
  .app{padding-top:8px;padding-bottom:10px}
  .header{height:58px}
  .welcome{height:102px}
  .ad{margin-bottom:9px}
  .menu-card{margin-bottom:6px;min-height:56px}
  .new{min-height:70px}
  .section-title{margin-top:1px;margin-bottom:7px}
  .new-play-circle{width:54px!important;height:54px!important;min-width:54px!important}
}

/* Çok kısa ekranlar */
@media(max-height:680px) and (orientation:portrait){
  .app{padding-top:6px;padding-bottom:7px}
  .header{height:50px}
  .logo{font-size:36px}
  .ad{height:100px;margin-bottom:6px}
  .welcome{height:88px;margin-bottom:6px}
  .avatar{width:58px;height:58px;font-size:34px}
  .greeting{font-size:17px;margin-bottom:5px}
  .stat-icon{font-size:20px}
  .stat b{font-size:15px}
  .stat small{font-size:8px}
  .menu-card{min-height:49px;margin-bottom:4px}
  .new{min-height:61px}
  .icon-circle{width:43px;height:43px;margin-right:8px}
  .new .icon-circle{width:48px;height:48px}
  .menu-copy b{font-size:18px}
  .menu-copy span{font-size:9px}
  .badge{width:34px;height:34px;min-width:34px;font-size:15px}
}

/* Yatay telefon */
@media(orientation:landscape) and (max-height:600px){
  .app{
    width:calc(100vw - 10px);
    height:calc(100dvh - 8px);
    padding:6px 16px 8px;
  }
  .header{height:48px}
  .ad{height:100px;margin:2px auto 6px}
  .welcome{height:78px;margin-bottom:6px}
  .avatar{width:55px;height:55px;font-size:32px}
  .greeting{font-size:18px;margin-bottom:4px}
  .menu-card{min-height:43px;margin-bottom:4px}
  .new{min-height:52px}
  .icon-circle{width:38px;height:38px;font-size:22px}
  .new .icon-circle{width:43px;height:43px}
  .menu-copy b{font-size:18px}
  .menu-copy span{font-size:9px}
}

</style>
</head>
<body>

<main class="app">
  <header class="header">
    <div class="confetti">
      <span class="c1"></span><span class="c2"></span><span class="c3"></span>
      <span class="c4"></span><span class="c5"></span><span class="c6"></span>
    </div>
    <div class="logo">Konfeti</div>
  </header>

  <section class="ad">
    <div class="ad-label">REKLAM</div>
    <div class="ad-chart">📈</div>
    <div class="ad-copy">
      <div class="ad-title">Kripto ile Kazan! 🚀</div>
      <div class="ad-sub">Bugünün fırsatlarını kaçırma.</div>
    </div>
    <div class="ad-coin">₿ 💰</div>
    <button class="ad-btn">YATIRIM YAP</button>
    <button class="ad-close" aria-label="Reklamı kapat">×</button>
  </section>

  <section class="welcome">
    <div class="avatar">👤<i class="online"></i></div>
    <div class="welcome-content">
      <div class="greeting">Hoş geldin, Can 👋</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-icon">🏆</div>
          <div><b>1.250</b><small>Puanın</small></div>
        </div>
        <div class="vline"></div>
        <div class="stat">
          <div class="stat-icon">🎮</div>
          <div><b>24</b><small>Oynadığın Oyun</small></div>
        </div>
      </div>
    </div>
  </section>

  <button class="menu-card new new-game-card" onclick="newGame()" aria-label="Yeni Oyun">
    <span class="new-play-circle" aria-hidden="true"><span class="new-play-triangle"></span></span>
    <span class="menu-copy"><b>Yeni Oyun</b><span>Hemen oynamaya başla!</span></span>
    <span class="arrow">›</span>
  </button>

  <button class="menu-card purple">
    <div class="icon-circle">🎮</div>
    <div class="menu-copy"><b>Oyunlarım</b><span>Devam eden oyunların</span></div>
    <div class="badge">2</div><div class="arrow">›</div>
  </button>

  <button class="menu-card orange">
    <div class="icon-circle">🏆</div>
    <div class="menu-copy"><b>Turnuva</b><span>Turnuvalara katıl, ödüller kazan!</span></div>
    <div class="badge">4</div><div class="arrow">›</div>
  </button>

  <div class="section-title">DİĞER</div>

  <button class="menu-card blue">
    <div class="icon-circle profile-icon" aria-hidden="true"><i class="profile-head"></i><i class="profile-body"></i></div>
    <div class="menu-copy"><b>Profil</b><span>Profilini ve istatistiklerini gör</span></div>
    <div class="arrow">›</div>
  </button>

  <button class="menu-card red">
    <div class="icon-circle">👥</div>
    <div class="menu-copy"><b>Arkadaşlar</b><span>Arkadaşlarınla bağlan</span></div>
    <div class="arrow">›</div>
  </button>
</main>

<script>document.querySelector('.ad-close').addEventListener('click',()=>document.querySelector('.ad').style.display='none');
</script>


</body>
</html>

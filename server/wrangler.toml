name = "konfeti"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
FIREBASE_PROJE_ID = "eren-63abb"
EN_DUSUK_SURUM = "1"

[[d1_databases]]
binding = "DB"
database_name = "konfeti"
database_id = "77084993-7ddf-4f3a-867f-844aa2ddac57"

# Kelime listesi (../words.js) metin olarak okunur
[[rules]]
type = "Text"
globs = ["**/words.js"]
fallthrough = false

# Odalar: her oyun için bir oyun odası, her oyuncu için bir kullanıcı odası
[[durable_objects.bindings]]
name = "OYUN_ODASI"
class_name = "OyunOdasi"

[[durable_objects.bindings]]
name = "KULLANICI_ODASI"
class_name = "KullaniciOdasi"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OyunOdasi", "KullaniciOdasi"]

# Günlük temizlik: her gece 03:07 (Türkiye saati; cron UTC ile yazılır)
[triggers]
crons = ["7 0 * * *"]

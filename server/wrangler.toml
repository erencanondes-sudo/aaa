name = "konfeti"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
FIREBASE_PROJE_ID = "eren-63abb"
EN_DUSUK_SURUM = "1"

[[d1_databases]]
binding = "DB"
database_name = "konfeti"
database_id = "BURAYA-D1-KIMLIGI"

# Kelime listesi (../words.js) metin olarak okunur
[[rules]]
type = "Text"
globs = ["**/words.js"]
fallthrough = false

# Turnuva turu odaları
[[durable_objects.bindings]]
name = "TUR_ODASI"
class_name = "TurOdasi"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TurOdasi"]

# Saatlik temizlik
[triggers]
crons = ["7 * * * *"]
